<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luraph VM Bytecode Decompiler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="branding">
                <h1>Luraph VM Decompiler</h1>
                <p>AST-Heuristic Instruction & Constant Decoder</p>
            </div>
            <div class="actions">
                <button id="decompile-btn" class="btn-primary">Decompile Script</button>
                <button id="clear-btn" class="btn-secondary">Clear Workspace</button>
            </div>
        </header>

        <main class="editor-layout">
            <div class="editor-pane">
                <div class="pane-header">
                    <span>Obfuscated Lua Input</span>
                </div>
                <textarea id="input-code" placeholder="Paste your obfuscated Luraph Lua script here..."></textarea>
            </div>

            <div class="sidebar-pane">
                <div class="pane-header">
                    <span>VM Metadata</span>
                </div>
                <div id="metadata-display" class="metadata-grid">
                    <div class="meta-item"><span class="label">Payload Size:</span> <span id="meta-size">--</span></div>
                    <div class="meta-item"><span class="label">Constants:</span> <span id="meta-constants">--</span></div>
                    <div class="meta-item"><span class="label">Parameters:</span> <span id="meta-params">--</span></div>
                    <div class="meta-item"><span class="label">Instructions:</span> <span id="meta-instructions">--</span></div>
                    <div class="meta-item"><span class="label">Nested Protos:</span> <span id="meta-protos">--</span></div>
                </div>
                <div class="pane-header" style="margin-top: 20px;">
                    <span>Detected Strings</span>
                </div>
                <div id="strings-list" class="strings-container">
                    <p class="empty-state">Run decompiler to list strings...</p>
                </div>
            </div>

            <div class="editor-pane">
                <div class="pane-header">
                    <span>Reconstructed Lua Output</span>
                </div>
                <textarea id="output-code" readonly placeholder="Output pseudo-code will generate here..."></textarea>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
