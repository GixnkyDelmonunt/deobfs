<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuaVM Bytecode Decompiler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1>LuaVM Static Decompiler</h1>
            <p class="subtitle">Analyze, decode, and decompile obfuscated Lua bytecode structures</p>
        </header>

        <main class="app-body">
            <section class="control-panel">
                <button id="decompile-btn" class="btn btn-primary">Decompile Script</button>
                <button id="clear-btn" class="btn btn-secondary">Clear Fields</button>
            </section>

            <div class="workspace">
                <section class="editor-section">
                    <div class="section-header">
                        <h2>Obfuscated Lua Input</h2>
                        <span class="badge">Paste Code Here</span>
                    </div>
                    <textarea id="input-code" placeholder="Paste your obfuscated Lua script here (e.g., the code containing the v15(...) call)..." spellcheck="false"></textarea>
                </section>

                <section class="editor-section">
                    <div class="section-header">
                        <h2>Reconstructed Output</h2>
                        <span class="badge badge-success" id="status-badge">Awaiting Input</span>
                    </div>
                    <textarea id="output-code" readonly placeholder="The decompiled Lua code and instruction listing will appear here..." spellcheck="false"></textarea>
                </section>
            </div>
        </main>

        <footer class="app-footer">
            <p>Analytical tool for reverse engineering, research, and non-proliferation analysis of obfuscated code.</p>
        </footer>
    </div>

    <!-- Load the decompiler backend logic -->
    <script src="decompiler.js"></script>
    
    <!-- Connect the user interface to the logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputField = document.getElementById('input-code');
            const outputField = document.getElementById('output-code');
            const decompileBtn = document.getElementById('decompile-btn');
            const clearBtn = document.getElementById('clear-btn');
            const statusBadge = document.getElementById('status-badge');

            decompileBtn.addEventListener('click', () => {
                const source = inputField.value.trim();
                if (!source) {
                    outputField.value = "-- Error: Please paste an obfuscated script into the input field.";
                    statusBadge.textContent = "Error";
                    statusBadge.className = "badge badge-error";
                    return;
                }

                statusBadge.textContent = "Processing...";
                statusBadge.className = "badge badge-warning";

                // Decompiler operates synchronously; defer slightly to allow UI thread to show status
                setTimeout(() => {
                    try {
                        const decompiler = new window.LuraphDecompiler();
                        const result = decompiler.decompile(source);
                        outputField.value = result;

                        if (result.startsWith("-- Error")) {
                            statusBadge.textContent = "Parsing Failed";
                            statusBadge.className = "badge badge-error";
                        } else {
                            statusBadge.textContent = "Decompiled";
                            statusBadge.className = "badge badge-success";
                        }
                    } catch (e) {
                        outputField.value = `-- Unexpected UI handler exception:\n-- ${e.message}\n-- Stack:\n${e.stack}`;
                        statusBadge.textContent = "Exception";
                        statusBadge.className = "badge badge-error";
                    }
                }, 50);
            });

            clearBtn.addEventListener('click', () => {
                inputField.value = "";
                outputField.value = "";
                statusBadge.textContent = "Awaiting Input";
                statusBadge.className = "badge";
            });
        });
    </script>
</body>
</html>
